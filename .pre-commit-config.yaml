repos:

  - repo: local
    hooks:

      - id: eslint
        name: eslint
        entry: npx eslint --no-warn-ignored
        language: system
        types_or:
          - javascript

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.6.1
    hooks:
      - id: editorconfig-checker
